# Copy to .cagent.toml (which is gitignored) and edit.
#
# One flat [cagent] table; every key is an AgentConfig field name. The loader
# reads ~/.cagent.toml first, then this file from the working directory, then
# CLI flags — there is no environment layer, so every setting has exactly one
# spelling. Unknown keys are an error, so a typo fails loudly instead of being
# ignored.

[cagent]

# --- endpoint (the only settings without usable defaults) -------------------
#
# A vendor table would have to carry vendor model names, and those go stale: a default of
# "gpt-4o-mini" or "claude-3-5-sonnet" stops working within months and fails as
# a remote 404 that explains nothing. Only you know what your endpoint serves.
#
# Anything OpenAI-compatible works — a vendor API, a gateway, a proxy, or a
# local server.

# Used verbatim, with "/chat/completions" appended ("/messages" on the
# anthropic wire). Include the version segment your provider publishes, usually
# ".../v1" — omitting it is the usual cause of a 404 on the first request. A
# trailing slash is fine.

base_url = "https://api.example.com/v1"

# The model name your endpoint expects. Required.

model = "the-model-your-endpoint-serves"

# The key belongs here or in ~/.cagent.toml; there is deliberately no flag for
# it, because a flag lands in shell history and the process list. Keep the file
# untracked (it is gitignored by default).

api_key = "your-key"

# "openai" = Chat Completions (the default; almost everything emulates it).
# "anthropic" = the Messages API.

wire = "openai"

# For a local server with no authentication, e.g. Ollama or llama.cpp:
# requires_key = false

temperature = 0.0
# reasoning_effort = "medium"   # OpenAI: none..max; Anthropic: low|medium|high|xhigh|max
max_output_tokens = 8192
request_timeout = 120.0
max_retries = 4

# --- cost reporting (optional) ---------------------------------------------
# No rates ship with this project: a built-in price table goes stale, and a
# stale price prints a confident dollar figure that is wrong. Token counts are
# always reported; add your own rates here to see money as well. Matching is by
# prefix, so a dated deployment name needs no extra row. US dollars per million
# tokens.
#
# [cagent.prices."the-model-your-endpoint-serves"]
# input_per_m = 0.27
# output_per_m = 1.10
# cached_input_per_m = 0.07     # optional

# --- context ---------------------------------------------------------------
context_window = 128000
compact_threshold = 0.75         # compact once the prompt reaches this fraction
keep_recent_turns = 6            # turns kept verbatim through a compaction
tool_output_head_lines = 60
tool_output_tail_lines = 40
tool_output_max_chars = 20000

# --- loop ------------------------------------------------------------------
# token_budget = 400000          # unset means no cumulative budget
max_repeated_calls = 3           # identical calls in a row before the loop stops
bash_timeout = 120.0

# --- edit ------------------------------------------------------------------
fuzzy_threshold = 0.86           # similarity floor for fuzzy edit matching

# --- safety ----------------------------------------------------------------
approval_mode = "auto-edit"      # "suggest" | "auto-edit" | "full-auto"
# workspace = "."                # unset means the working directory
# false confines file tools to the workspace. Host run_bash is still an
# unrestricted process when Docker is unavailable, so cagent prints a warning.
# true allows file tools outside the workspace; it is the danger-full-access
# equivalent for file paths.
allow_outside_workspace = false

# --- disposable Docker sandbox ---------------------------------------------
# sandbox_mode = "auto"             # "auto" (default) | "off" | "docker"
# auto uses Docker when the daemon and image are available, otherwise warns
# and falls back to the unrestricted host shell. docker fails closed if either
# prerequisite is unavailable; off explicitly selects the host shell.
# sandbox_sync = "ask"               # "never" | "ask" | "always"
# sandbox_image = "python:3.12-slim" # local image; build Dockerfile.agent for project deps
# sandbox_network = false             # true enables Docker's default bridge network
# sandbox_memory_mb = 1024
# sandbox_cpus = 2.0
# sandbox_pids = 256
# sandbox_workspace_mb = 512

# --- repomap ---------------------------------------------------------------
repo_map_enabled = true
repo_map_token_budget = 1600

# --- observability ---------------------------------------------------------
# trace_dir = "traces"           # unset disables trace files
log_level = "INFO"
